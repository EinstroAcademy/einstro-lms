<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstro LMS - Firebase Demo</title>
</head>
<body>
    <h1>Einstro LMS - Firebase Integration</h1>

    <!-- Course Form -->
    <form id="courseForm">
        <label>Course Name: <input type="text" id="courseName" required></label><br><br>
        <label>Instructor: <input type="text" id="instructor" required></label><br><br>
        <button type="submit">Add Course</button>
    </form>

    <h2>Courses List</h2>
    <ul id="coursesList"></ul>

    <!-- Firebase SDKs -->
    <script type="module">
        // Import Firebase SDKs (v9+ modular)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        // TODO: Replace with your Firebase project configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const courseForm = document.getElementById('courseForm');
        const coursesList = document.getElementById('coursesList');

        // Add course to Firestore
        courseForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('courseName').value.trim();
            const instructor = document.getElementById('instructor').value.trim();

            if (!name || !instructor) {
                alert("Please fill in all fields.");
                return;
            }

            try {
                await addDoc(collection(db, "courses"), {
                    name,
                    instructor,
                    createdAt: new Date()
                });
                alert("Course added successfully!");
                courseForm.reset();
                loadCourses();
            } catch (error) {
                console.error("Error adding course: ", error);
                alert("Failed to add course.");
            }
        });

        // Load courses from Firestore
        async function loadCourses() {
            coursesList.innerHTML = "";
            try {
                const querySnapshot = await getDocs(collection(db, "courses"));
                querySnapshot.forEach((doc) => {
                    const course = doc.data();
                    const li = document.createElement('li');
                    li.textContent = `${course.name} - Instructor: ${course.instructor}`;
                    coursesList.appendChild(li);
                });
            } catch (error) {
                console.error("Error loading courses: ", error);
            }
        }

        // Initial load
        loadCourses();
    </script>
</body>
</html>
